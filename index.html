<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Rating System - Seller Credibility Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .csv-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success { background: #28a745; }
        .btn-info { background: #17a2b8; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #ffc107; color: #333; }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .summary-card h3 {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .summary-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .sellers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }

        .seller-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .seller-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .seller-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .seller-info h3 {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .seller-id {
            color: #999;
            font-size: 0.9em;
        }

        .stamp-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .stamp-badge.green {
            background: #d4edda;
            color: #155724;
        }

        .stamp-badge.blue {
            background: #d1ecf1;
            color: #0c5460;
        }

        .stamp-badge.yellow {
            background: #fff3cd;
            color: #856404;
        }

        .stamp-badge.red {
            background: #f8d7da;
            color: #721c24;
        }

        .score-display {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .score-value {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .score-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 1.1em;
            color: #333;
            font-weight: 600;
        }

        .risk-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .risk-low {
            background: #d4edda;
            color: #155724;
        }

        .risk-medium {
            background: #fff3cd;
            color: #856404;
        }

        .risk-high {
            background: #f8d7da;
            color: #721c24;
        }

        .summary-text {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-top: 15px;
            font-size: 0.95em;
            line-height: 1.5;
            color: #555;
        }

        .strengths-concerns {
            margin-top: 15px;
        }

        .strengths-concerns h4 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .strengths-concerns ul {
            list-style: none;
            padding-left: 0;
        }

        .strengths-concerns li {
            padding: 6px 0;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .strength-item {
            color: #28a745;
        }

        .strength-item:before {
            content: "✓ ";
            font-weight: bold;
        }

        .concern-item {
            color: #dc3545;
        }

        .concern-item:before {
            content: "⚠ ";
            font-weight: bold;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 768px) {
            .sellers-grid {
                grid-template-columns: 1fr;
            }
            
            .details-grid {
                grid-template-columns: 1fr;
            }
            
            .button-row {
                flex-direction: column;
                align-items: stretch;
            }
            
            .csv-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Logistics Rating System</h1>
            <p>AI-Powered Seller Credibility Analysis</p>
        </div>

        <div class="upload-section">
            <div class="button-row">
                <h2 style="color: #333; margin: 0;">Upload Seller Data</h2>
                <div class="csv-buttons">
                    <button class="btn btn-success" onclick="downloadSampleCSV('comprehensive')">
                        📥 Comprehensive
                    </button>
                    <button class="btn btn-info" onclick="downloadSampleCSV('top_performers')">
                        ⭐ Top Performers
                    </button>
                    <button class="btn btn-danger" onclick="downloadSampleCSV('risky_sellers')">
                        ⚠️ Risky Sellers
                    </button>
                    <button class="btn btn-warning" onclick="downloadSampleCSV('mixed')">
                        🔀 Mixed (20)
                    </button>
                </div>
            </div>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h3>Drag & Drop CSV File Here</h3>
                <p style="color: #999; margin: 10px 0;">or</p>
                <input type="file" id="fileInput" class="file-input" accept=".csv">
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    Browse Files
                </button>
                <p style="color: #999; margin-top: 15px; font-size: 0.9em;">
                    CSV should include: seller_id, seller_name, seller_since, total_sales, reviews, etc.
                </p>
            </div>
            <button class="btn" id="analyzeBtn" onclick="analyzeSellers()" disabled style="margin-top: 20px;">
                Analyze Sellers
            </button>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing sellers with IBM Watsonx AI...</p>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="summary-cards" id="summaryCards"></div>
            <div class="sellers-grid" id="sellersGrid"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        let sellersData = [];
        const API_URL = 'http://localhost:5000';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const errorMessage = document.getElementById('errorMessage');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.csv')) {
                handleFile(file);
            } else {
                showError('Please upload a CSV file');
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        sellersData = processCSVData(results.data);
                        uploadArea.querySelector('h3').textContent = `✓ ${file.name} loaded (${sellersData.length} sellers)`;
                        uploadArea.style.borderColor = '#28a745';
                        analyzeBtn.disabled = false;
                        errorMessage.style.display = 'none';
                    } else {
                        showError('No valid data found in CSV');
                    }
                },
                error: function(error) {
                    showError('Error parsing CSV: ' + error.message);
                }
            });
        }

        function processCSVData(data) {
            return data.map(row => {
                let reviews = [];
                if (row.reviews) {
                    try {
                        reviews = typeof row.reviews === 'string' 
                            ? JSON.parse(row.reviews) 
                            : row.reviews;
                    } catch (e) {
                        reviews = [];
                    }
                }

                return {
                    seller_id: row.seller_id || `SELL_${Math.random().toString(36).substr(2, 9)}`,
                    seller_name: row.seller_name || 'Unknown Seller',
                    seller_since: row.seller_since || new Date().toISOString(),
                    total_sales: parseInt(row.total_sales) || 0,
                    average_transaction_value: parseFloat(row.average_transaction_value) || 0,
                    reviews: reviews,
                    dispute_rate: parseFloat(row.dispute_rate) || 0,
                    on_time_rate: parseFloat(row.on_time_rate) || 1.0,
                    avg_response_hours: parseFloat(row.avg_response_hours) || 24,
                    verified: row.verified === 'true' || row.verified === true || false
                };
            });
        }

        async function analyzeSellers() {
            if (sellersData.length === 0) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';
            analyzeBtn.disabled = true;

            try {
                const results = [];
                
                for (const seller of sellersData) {
                    const response = await fetch(`${API_URL}/seller/credibility`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(seller)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        results.push({
                            seller_name: seller.seller_name,
                            seller_id: seller.seller_id,
                            ...data
                        });
                    } else {
                        results.push({
                            seller_name: seller.seller_name,
                            seller_id: seller.seller_id,
                            credibility: generateFallbackScore(seller),
                            stamp: getStampForScore(generateFallbackScore(seller).credibility_score)
                        });
                    }
                }

                displayResults(results);
            } catch (error) {
                showError('Error analyzing sellers: ' + error.message);
                console.error(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }

        function generateFallbackScore(seller) {
            let score = 50;
            
            if (seller.total_sales > 1000) score += 20;
            else if (seller.total_sales > 500) score += 15;
            else if (seller.total_sales > 200) score += 10;
            else if (seller.total_sales > 50) score += 5;
            
            score += (seller.on_time_rate - 0.5) * 50;
            score -= seller.dispute_rate * 100;
            
            const reviews = seller.reviews || [];
            let avgRating = 0;
            if (reviews.length > 0) {
                avgRating = reviews.reduce((sum, r) => sum + (r.rating || 0), 0) / reviews.length;
                score += (avgRating - 3) * 7.5;
            }
            
            if (seller.verified) score += 5;
            
            score = Math.max(0, Math.min(100, Math.round(score)));
            
            const strengths = [];
            if (seller.total_sales > 500) {
                strengths.push(`High sales volume with ${seller.total_sales} completed transactions`);
            } else if (seller.total_sales > 200) {
                strengths.push(`Established seller with ${seller.total_sales} completed transactions`);
            } else {
                strengths.push(`Growing seller with ${seller.total_sales} transactions`);
            }
            
            if (seller.on_time_rate > 0.95) {
                strengths.push(`Excellent on-time delivery rate of ${(seller.on_time_rate * 100).toFixed(1)}%`);
            } else if (seller.on_time_rate > 0.85) {
                strengths.push(`Good on-time delivery rate of ${(seller.on_time_rate * 100).toFixed(1)}%`);
            }
            
            if (avgRating >= 4.5 && reviews.length > 0) {
                strengths.push(`Outstanding customer rating of ${avgRating.toFixed(1)}/5 stars from ${reviews.length} reviews`);
            } else if (avgRating >= 4.0 && reviews.length > 0) {
                strengths.push(`Strong customer rating of ${avgRating.toFixed(1)}/5 stars from ${reviews.length} reviews`);
            }
            
            if (seller.verified && strengths.length < 3) {
                strengths.push('Identity verified for added security');
            }
            
            const concerns = [];
            if (seller.dispute_rate > 0.10) {
                concerns.push(`High dispute rate of ${(seller.dispute_rate * 100).toFixed(1)}% requires attention`);
            } else if (seller.dispute_rate > 0.05) {
                concerns.push(`Moderate dispute rate of ${(seller.dispute_rate * 100).toFixed(1)}%`);
            }
            
            if (seller.on_time_rate < 0.80) {
                concerns.push(`Below-average on-time rate of ${(seller.on_time_rate * 100).toFixed(1)}%`);
            }
            
            if ((seller.avg_response_hours || 24) > 24) {
                concerns.push(`Slow response time averaging ${(seller.avg_response_hours || 24).toFixed(1)} hours`);
            }
            
            if (avgRating < 4.0 && reviews.length > 0) {
                concerns.push(`Below-average customer rating of ${avgRating.toFixed(1)}/5 stars`);
            }
            
            if (seller.total_sales < 100) {
                concerns.push(`Limited transaction history with only ${seller.total_sales} sales`);
            }
            
            if (concerns.length === 0) {
                concerns.push('No major concerns identified');
            }

            return {
                seller_id: seller.seller_id,
                credibility_score: score,
                risk_level: score >= 75 ? 'low' : score >= 50 ? 'medium' : 'high',
                recommendation: score >= 75 ? 'approve' : score >= 50 ? 'review' : 'reject',
                summary: `Seller with ${seller.total_sales} sales, ${(seller.on_time_rate * 100).toFixed(0)}% on-time rate, and ${avgRating.toFixed(1)}/5 average rating`,
                key_strengths: strengths.slice(0, 3),
                key_concerns: concerns.slice(0, 2)
            };
        }

        function getStampForScore(score) {
            if (score >= 86) {
                return { stamp: 'EXCELLENT', color: 'green', message: 'Highly Trusted Seller', badge: '✓✓✓' };
            } else if (score >= 75) {
                return { stamp: 'APPROVED', color: 'green', message: 'Trusted Seller', badge: '✓✓' };
            } else if (score >= 61) {
                return { stamp: 'GOOD', color: 'blue', message: 'Reliable Seller', badge: '✓' };
            } else if (score >= 45) {
                return { stamp: 'REVIEW', color: 'yellow', message: 'Needs Review', badge: '?' };
            } else {
                return { stamp: 'HIGH_RISK', color: 'red', message: 'Not Recommended', badge: '✗' };
            }
        }

        function displayResults(results) {
            const summaryCards = document.getElementById('summaryCards');
            const sellersGrid = document.getElementById('sellersGrid');

            const totalSellers = results.length;
            const avgScore = results.reduce((sum, r) => sum + r.credibility.credibility_score, 0) / totalSellers;
            const approvedCount = results.filter(r => r.credibility.recommendation === 'approve').length;
            const highRiskCount = results.filter(r => r.credibility.risk_level === 'high').length;

            summaryCards.innerHTML = `
                <div class="summary-card">
                    <h3>Total Sellers</h3>
                    <div class="value">${totalSellers}</div>
                </div>
                <div class="summary-card">
                    <h3>Average Score</h3>
                    <div class="value">${avgScore.toFixed(1)}</div>
                </div>
                <div class="summary-card">
                    <h3>Approved</h3>
                    <div class="value" style="color: #28a745;">${approvedCount}</div>
                </div>
                <div class="summary-card">
                    <h3>High Risk</h3>
                    <div class="value" style="color: #dc3545;">${highRiskCount}</div>
                </div>
            `;

            sellersGrid.innerHTML = results.map(result => {
                const cred = result.credibility;
                const stamp = result.stamp;

                return `
                    <div class="seller-card">
                        <div class="seller-header">
                            <div class="seller-info">
                                <h3>${result.seller_name}</h3>
                                <div class="seller-id">${result.seller_id}</div>
                            </div>
                            <span class="stamp-badge ${stamp.color}">
                                ${stamp.badge} ${stamp.stamp}
                            </span>
                        </div>

                        <div class="score-display">
                            <div class="score-label">CREDIBILITY SCORE</div>
                            <div class="score-value">${cred.credibility_score}/100</div>
                            <div class="score-label">${stamp.message}</div>
                        </div>

                        <div class="details-grid">
                            <div class="detail-item">
                                <div class="detail-label">Risk Level</div>
                                <div class="detail-value">
                                    <span class="risk-indicator risk-${cred.risk_level}">
                                        ${cred.risk_level.toUpperCase()}
                                    </span>
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Recommendation</div>
                                <div class="detail-value">${cred.recommendation.toUpperCase()}</div>
                            </div>
                        </div>

                        <div class="summary-text">
                            ${cred.summary || 'Credibility assessment completed'}
                        </div>

                        ${cred.key_strengths && cred.key_strengths.length > 0 ? `
                            <div class="strengths-concerns">
                                <h4>Key Strengths</h4>
                                <ul>
                                    ${cred.key_strengths.slice(0, 3).map(s => 
                                        `<li class="strength-item">${Array.isArray(s) ? s[0] : s}</li>`
                                    ).join('')}
                                </ul>
                            </div>
                        ` : ''}

                        ${cred.key_concerns && cred.key_concerns.length > 0 ? `
                            <div class="strengths-concerns">
                                <h4>Key Concerns</h4>
                                <ul>
                                    ${cred.key_concerns.slice(0, 2).map(c => 
                                        `<li class="concern-item">${Array.isArray(c) ? c[0] : c}</li>`
                                    ).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            document.getElementById('resultsSection').style.display = 'block';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function downloadSampleCSV(type) {
            const csvData = getCSVData(type);
            const blob = new Blob([csvData.content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', csvData.filename);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function getCSVData(type) {
            const header = `seller_id,seller_name,seller_since,total_sales,average_transaction_value,dispute_rate,on_time_rate,avg_response_hours,verified,reviews\n`;
            
            const datasets = {
                comprehensive: `SELL_001,TechSupplies Co,2023-01-15T00:00:00Z,487,1250.50,0.02,0.94,3.5,true,"[{""rating"":5,""comment"":""Excellent service""}]"
